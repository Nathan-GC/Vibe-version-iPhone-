group 'com.example.vibe_power'
version '1.0'

// Pas de bloc buildscript : l'Android Gradle Plugin est fourni par le
// projet hôte (android/settings.gradle.kts), aucune résolution réseau.
apply plugin: 'com.android.library'

android {
    namespace 'com.example.vibe_power'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
